[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "dvc >= 3, < 4",
  "mlflow >= 3, < 4",
  "pillow >= 11",
  "torch >= 2.6",
  "torchvision >= 0.21",
]
description = "Experiment with landscape classifying."
homepage = "https://github.com/shuuchuu/landscape-classifier"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "landscape-classifier"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.optional-dependencies]
fastapi = [
  "fastapi[standard] >= 0.115, < 1",
  "prometheus-fastapi-instrumentator >= 7, < 8",
]
notebook = [
  "jupyter >= 1, < 2",
]

[project.scripts]
landscape-classifier = "landscape_classifier.cli:train_cli"

[dependency-groups]
dev = [
  "doit >= 0.37",
  "ruff >= 0.17",
  "ty >= 0.0.88",
]

# CPU wheels of PyTorch: an image or a Codespace without the GPU libraries,
# several GB smaller. Colab keeps its own torch, which already satisfies the
# requirements above.
[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [{index = "pytorch-cpu"}]
torchvision = [{index = "pytorch-cpu"}]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["X", "X_*", "Y", "Y_*"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
