[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = []
description = "Experiment with landscape classifying."
homepage = "https://github.com/shuuchuu/landscape-classifier"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "landscape-classifier"
readme = "README.md"
requires-python = ">= 3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "doit >= 0.37",
  "ruff >= 0.16",
  "ty >= 0.0.33",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.15,<0.13.0"]
